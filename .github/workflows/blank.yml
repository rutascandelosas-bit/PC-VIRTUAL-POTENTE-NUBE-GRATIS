
name: Windows Cloud

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Comprobar Windows
        shell: pwsh
        run: |
          Write-Host "Windows en la nube funcionando"
          Get-ComputerInfo |
            Select-Object WindowsProductName,
                          WindowsVersion
          Write-Host "CPU:"
          Get-CimInstance Win32_Processor |
            Select-Object -ExpandProperty Name
          Write-Host "RAM:"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object TotalVisibleMemorySize
          Write-Host "Prueba completada correctamente"
          
